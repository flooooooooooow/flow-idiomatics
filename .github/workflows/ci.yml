name: Idiomatics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idiomatics-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Flow showcases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout idiomatics
        uses: actions/checkout@v7

      - name: Checkout current Flow
        uses: actions/checkout@v7
        with:
          repository: flooooooooooow/flow
          path: .flow-toolchain

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .flow-toolchain/requirements.lock

      - name: Install Flow host dependencies
        run: python -m pip install -r .flow-toolchain/requirements.lock

      - name: Run memory showcase
        run: FLOW_HOST=python .flow-toolchain/flow run showcases/memory/borrowed_signal.flow

      - name: Run effect showcase
        run: FLOW_HOST=python .flow-toolchain/flow run showcases/effects/packet_admission_worlds.flow

      - name: Run maximal systems collision
        run: FLOW_HOST=python .flow-toolchain/flow run maximal/edge_of_wtf.flow

      - name: Run maximal adaptive pipeline
        run: FLOW_HOST=python .flow-toolchain/flow run maximal/adaptive_pipeline.flow

      - name: Run closed-loop evolution showcase
        run: FLOW_HOST=python .flow-toolchain/flow run showcases/evolution/closed_loop_motor.flow

      - name: Run maximal evolving/effectful system
        run: FLOW_HOST=python .flow-toolchain/flow run maximal/evolving_effectful_system.flow

  benchmark:
    name: Native benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout idiomatics
        uses: actions/checkout@v7

      - name: Checkout current Flow
        uses: actions/checkout@v7
        with:
          repository: flooooooooooow/flow
          path: .flow-toolchain

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .flow-toolchain/requirements.lock

      - name: Install Flow host dependencies
        run: python -m pip install -r .flow-toolchain/requirements.lock

      - name: Run benchmark
        run: python benchmarks/run.py --flow-root .flow-toolchain --samples 5

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f benchmarks/benchmark-results.md ]; then
            cat benchmarks/benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
          fi
