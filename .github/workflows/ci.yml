name: Idiomatics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idiomatics-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c-native:
    name: C backend / execute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout idiomatics
        uses: actions/checkout@v7

      - name: Checkout current Flow
        uses: actions/checkout@v7
        with:
          repository: flooooooooooow/flow
          path: .flow-toolchain

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .flow-toolchain/requirements.lock

      - name: Install Flow host dependencies
        run: python -m pip install -r .flow-toolchain/requirements.lock

      - name: Execute every portable showcase through C
        shell: bash
        run: |
          set -euo pipefail
          programs=(
            showcases/memory/borrowed_signal.flow
            showcases/effects/packet_admission_worlds.flow
            maximal/edge_of_wtf.flow
            maximal/adaptive_pipeline.flow
            showcases/evolution/closed_loop_motor.flow
            showcases/evolution/hybrid_bounce.flow
            maximal/evolving_effectful_system.flow
          )

          for program in "${programs[@]}"; do
            echo "::group::C/native $program"
            FLOW_HOST=python FLOW_CPU_BACKEND=c .flow-toolchain/flow run "$program" --backend=c
            echo "::endgroup::"
          done

  mlir-lowering:
    name: MLIR backend / lower + verify
    runs-on: ubuntu-latest
    env:
      LLVM_PATH: /usr/lib/llvm-18/bin

    steps:
      - name: Checkout idiomatics
        uses: actions/checkout@v7

      - name: Checkout Flow MLIR parity commit
        uses: actions/checkout@v7
        with:
          repository: flooooooooooow/flow
          ref: c388b9a653456e94aa9d2bcc7e3059f0edee4221
          path: .flow-toolchain

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .flow-toolchain/requirements.lock

      - name: Install Flow host dependencies
        run: python -m pip install -r .flow-toolchain/requirements.lock

      - name: Install LLVM and MLIR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-tools mlir-18-tools
          test -x "$LLVM_PATH/mlir-opt"
          test -x "$LLVM_PATH/mlir-translate"

      - name: Lower and verify every portable showcase as MLIR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/mlir

          programs=(
            showcases/memory/borrowed_signal.flow
            showcases/effects/packet_admission_worlds.flow
            maximal/edge_of_wtf.flow
            maximal/adaptive_pipeline.flow
            showcases/evolution/closed_loop_motor.flow
            showcases/evolution/hybrid_bounce.flow
            maximal/evolving_effectful_system.flow
          )

          for program in "${programs[@]}"; do
            base="$(basename "$program" .flow)"
            log=".artifacts/mlir/${base}.log"
            mlir=".flow-toolchain/build/${base}.mlir"
            echo "::group::MLIR/lower+verify $program"
            FLOW_HOST=python FLOW_CPU_BACKEND=mlir .flow-toolchain/flow mlir "$program" 2>&1 | tee "$log"
            test -s "$mlir"
            "$LLVM_PATH/mlir-opt" "$mlir" -o /dev/null
            echo "::endgroup::"
          done

  benchmark:
    name: Native benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout idiomatics
        uses: actions/checkout@v7

      - name: Checkout current Flow
        uses: actions/checkout@v7
        with:
          repository: flooooooooooow/flow
          path: .flow-toolchain

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .flow-toolchain/requirements.lock

      - name: Install Flow host dependencies
        run: python -m pip install -r .flow-toolchain/requirements.lock

      - name: Run benchmark
        run: python benchmarks/run.py --flow-root .flow-toolchain --samples 5

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f benchmarks/benchmark-results.md ]; then
            cat benchmarks/benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
          fi
